<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0a1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="Nebula · Interactive magnetic particles with galaxy neon links">
<title>Nebula ✨</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><radialGradient id='g' cx='50%25' cy='50%25' r='50%25'><stop offset='0%25' stop-color='%237ff7ff'/><stop offset='45%25' stop-color='%23b400ff'/><stop offset='100%25' stop-color='%230a0a1a'/></radialGradient></defs><circle cx='50' cy='50' r='48' fill='url(%23g)'/><circle cx='50' cy='50' r='8' fill='%23fff' opacity='0.9'/><circle cx='35' cy='40' r='2.5' fill='%237ff7ff' opacity='0.8'/><circle cx='68' cy='55' r='2' fill='%23ff66cc' opacity='0.8'/><circle cx='55' cy='30' r='1.5' fill='%23fff' opacity='0.7'/><circle cx='40' cy='68' r='2' fill='%23b400ff' opacity='0.7'/></svg>">
<link rel="apple-touch-icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%230a0a1a'/><defs><radialGradient id='g' cx='50%25' cy='50%25' r='50%25'><stop offset='0%25' stop-color='%237ff7ff'/><stop offset='45%25' stop-color='%23b400ff'/><stop offset='100%25' stop-color='%230a0a1a'/></radialGradient></defs><circle cx='50' cy='50' r='45' fill='url(%23g)'/><circle cx='50' cy='50' r='7' fill='%23fff' opacity='0.9'/></svg>">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="logo">
  <span class="logo-star">✦</span>
  <span class="logo-text">NEBULA</span>
</div>

<!-- Indicador del dispositivo detectado -->
<div class="device-badge" id="deviceBadge"></div>

<button id="toggleBtn" title="Abrir controles" aria-label="Abrir panel de control">⚙</button>

<div id="panel">
  <h2>◈ Controles</h2>

  <div class="ctrl">
    <div class="ctrl-header">
      <span class="ctrl-label">Partículas</span>
      <span class="ctrl-value" id="vCount">180</span>
    </div>
    <input type="range" id="sCount" min="20" max="500" value="180" step="5" aria-label="Cantidad de partículas">
  </div>

  <div class="ctrl">
    <div class="ctrl-header">
      <span class="ctrl-label">Fuerza del imán</span>
      <span class="ctrl-value" id="vMagnet">1.0×</span>
    </div>
    <input type="range" id="sMagnet" min="0.2" max="3" value="1" step="0.1" aria-label="Fuerza del imán">
  </div>

  <div class="ctrl">
    <div class="ctrl-header">
      <span class="ctrl-label">Radio de captura</span>
      <span class="ctrl-value" id="vRadius">90px</span>
    </div>
    <input type="range" id="sRadius" min="30" max="250" value="90" step="5" aria-label="Radio de captura">
  </div>

  <div class="ctrl">
    <div class="ctrl-header">
      <span class="ctrl-label">Máx. siguiendo</span>
      <span class="ctrl-value" id="vMax">12</span>
    </div>
    <input type="range" id="sMax" min="1" max="40" value="12" step="1" aria-label="Máximo siguiendo al mouse">
  </div>

  <div class="ctrl">
    <div class="ctrl-header">
      <span class="ctrl-label">Zoom</span>
      <span class="ctrl-value" id="vZoom">1.0×</span>
    </div>
    <input type="range" id="sZoom" min="1" max="4" value="1" step="0.05" aria-label="Zoom">
  </div>

  <button id="resetZoom">↺ Reset Zoom</button>
</div>

<div class="info" id="infoText"></div>

<canvas id="c"></canvas>

<script src="js/nebula.js"></script>
</body>
</html>
